name: Deploy production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NEED_GAMES_PRODUCTION_D1_DATABASE_ID: ${{ secrets.PRODUCTION_D1_DATABASE_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Reject non-main refs
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo 'Production deployment is restricted to refs/heads/main.' >&2
          exit 1

      - name: Set up toolchain
        uses: ./.github/actions/setup

      - name: Check tracked release configuration
        run: pnpm release:check

      - name: Verify release candidate
        run: pnpm check:local

      - name: Create temporary production configuration
        run: node scripts/create-production-wrangler-config.mts

      - name: Verify production D1 identity and release state
        run: |
          mkdir -p .wrangler/production-release
          pnpm exec wrangler d1 info need-games-production --env production --config .wrangler.production.jsonc --json > .wrangler/production-release/info.json
          pnpm exec wrangler d1 execute need-games-production --env production --config .wrangler.production.jsonc --remote --json --command "SELECT dataset_version, schema_version FROM catalog_release_metadata; SELECT id, name FROM d1_migrations ORDER BY id;" > .wrangler/production-release/state.json
          node scripts/verify-production-d1.mts --info-file .wrangler/production-release/info.json --state-file .wrangler/production-release/state.json

      - name: Apply production D1 migrations
        run: pnpm exec wrangler d1 migrations apply need-games-production --env production --config .wrangler.production.jsonc --remote

      - name: Deploy production Worker
        run: pnpm exec wrangler deploy --env production --config .wrangler.production.jsonc

      - name: Smoke test deployed Worker
        if: ${{ vars.PRODUCTION_WORKER_URL != '' }}
        env:
          PRODUCTION_WORKER_URL: ${{ vars.PRODUCTION_WORKER_URL }}
        run: |
          curl --fail-with-body --silent --show-error "$PRODUCTION_WORKER_URL/api/catalog" > /dev/null
          curl --fail-with-body --silent --show-error "$PRODUCTION_WORKER_URL/api/games/counter-strike-2" > /dev/null
          curl --fail-with-body --silent --show-error "$PRODUCTION_WORKER_URL/api/session" > /dev/null
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$PRODUCTION_WORKER_URL/api/not-a-route")"
          test "$status" = '404'
